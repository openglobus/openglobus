<html>
    <head>
        <title>OpenGlobus - Cube</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../../lib/og.css" type="text/css" />
        <style>
            body {
                padding: 0;
                margin: 0;
            }
        </style>
    </head>

    <body>
        <div id="globus" style="position: absolute; width: 100%; height: 100%"></div>
        <script type="module" id="og-sandbox-script">
            import {
                CanvasTiles,
                EquiangularCubeQuadTreeStrategy,
                EmptyTerrain,
                Globe,
                ProceduralTerrain,
                control
            } from "../../lib/og.es.js";

            const FACE_COLORS = ["#e6e6e6", "#d9534f", "#5cb85c", "#428bca", "#f0ad4e", "#6f5499"];

            const tiles = new CanvasTiles("Cube tiles", {
                isBaseLayer: true,
                drawTile: (material, applyCanvas) => {
                    const { tileGroup, tileX, tileY, tileZoom } = material.segment,
                        canvas = document.createElement("canvas");

                    canvas.width = canvas.height = 256;

                    const ctx = canvas.getContext("2d");

                    ctx.fillStyle = FACE_COLORS[tileGroup];
                    ctx.fillRect(0, 0, 256, 256);

                    ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
                    if ((tileX + tileY) % 2) {
                        ctx.fillRect(0, 0, 256, 256);
                    }

                    ctx.strokeStyle = "black";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(0, 0, 256, 256);

                    ctx.fillStyle = "black";
                    ctx.font = "bold 28px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(`face ${tileGroup}`, 128, 110);
                    ctx.fillText(`${tileZoom} / ${tileX} / ${tileY}`, 128, 150);

                    applyCanvas(canvas);
                }
            });

            function height(lonLat) {
                const lon = (lonLat.lon * Math.PI) / 180,
                    lat = (lonLat.lat * Math.PI) / 180,
                    x = Math.cos(lat) * Math.cos(lon),
                    y = Math.cos(lat) * Math.sin(lon),
                    z = Math.sin(lat);

                return (
                    3000 * (Math.sin(7 * x + 1) + Math.sin(9 * y + 2) + Math.sin(8 * z)) +
                    600 * Math.sin(50 * x) * Math.sin(50 * y) * Math.sin(50 * z)
                );
            }

            const SIZE = 33;

            const relief = new ProceduralTerrain("Relief", {
                // The SIZE x SIZE heights
                plainGridSize: SIZE - 1,
                maxZoom: 12,
                maxHeight: 10000,
                getHeights: (segment) => {
                    const e = segment.getExtent(),
                        west = e.southWest.lon,
                        north = e.northEast.lat,
                        step = e.getWidth() / (SIZE - 1),
                        heights = new Float32Array(SIZE * SIZE);

                    for (let i = 0; i < SIZE; i++) {
                        for (let j = 0; j < SIZE; j++) {
                            heights[i * SIZE + j] = height(segment.getLonLat(west + j * step, north - i * step));
                        }
                    }

                    return heights;
                }
            });

            window.globus = new Globe({
                target: "globus",
                name: "Cube",
                quadTreeStrategyPrototype: EquiangularCubeQuadTreeStrategy,
                terrain: [new EmptyTerrain({ name: "Empty" }), relief],
                layers: [tiles],
                atmosphereEnabled: false,
                idleMode: true,
                nightTextureSrc: null,
                specularTextureSrc: null
            });

            globus.planet.addControl(new control.LayerSwitcher());
            globus.planet.addControl(new control.ToggleWireframe());
            globus.planet.addControl(new control.DebugInfo());
        </script>
    </body>
</html>
