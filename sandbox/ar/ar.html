<!DOCTYPE html>
<html>
    <head>
        <title>OpenGlobus Transparent Background</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="./ar.js" type="module"></script>
        <link rel="stylesheet" href="../../css/og.css" type="text/css" />
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
                overflow: hidden;
                font-family: Arial, sans-serif;
            }

            .html-background {
                position: absolute;
                inset: 0;
                display: grid;
                place-items: center;
                color: #e7f7ff;
                background:
                    linear-gradient(90deg, rgba(87, 215, 255, 0.18) 1px, transparent 1px),
                    linear-gradient(rgba(87, 215, 255, 0.18) 1px, transparent 1px),
                    radial-gradient(circle at 28% 24%, rgba(49, 168, 255, 0.24), transparent 34%),
                    linear-gradient(135deg, #07111f 0%, #101827 45%, #05070c 100%);
                background-size:
                    64px 64px,
                    64px 64px,
                    auto,
                    auto;
            }

            .html-background::before {
                content: "HTML background behind transparent globe canvas";
                max-width: min(960px, calc(100% - 48px));
                padding: 30px 38px;
                border: 1px solid rgba(130, 225, 255, 0.42);
                background: rgba(2, 8, 18, 0.66);
                font-size: 48px;
                font-weight: 700;
                line-height: 1.25;
                text-align: center;
                box-shadow: 0 0 48px rgba(87, 215, 255, 0.18);
            }

            #earth {
                position: absolute;
                inset: 0;
                background: transparent;
            }

            #earth .og-inner {
                background: transparent;
            }

            .ar-controls {
                position: absolute;
                left: 24px;
                bottom: 24px;
                z-index: 2;
                display: grid;
                gap: 10px;
                width: min(360px, calc(100% - 48px));
                padding: 16px 18px;
                border: 1px solid rgba(130, 225, 255, 0.42);
                background: rgba(2, 8, 18, 0.72);
                color: #e7f7ff;
                font-size: 14px;
                box-shadow: 0 0 32px rgba(87, 215, 255, 0.16);
            }

            .ar-controls label {
                display: flex;
                justify-content: space-between;
                gap: 16px;
                font-weight: 700;
            }

            .ar-controls input {
                width: 100%;
            }
        </style>
    </head>

    <body>
        <div class="html-background"></div>
        <div id="earth"></div>
        <div class="ar-controls">
            <label for="planetOpacity">
                Planet opacity
                <span id="planetOpacityValue">0.42</span>
            </label>
            <input id="planetOpacity" type="range" min="0" max="1" step="0.01" value="0.42" />
        </div>

    </body>
</html>
