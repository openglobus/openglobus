<!DOCTYPE html>
<html>
    <head>
        <title>OpenGlobus Transparent Background</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../../css/og.css" type="text/css" />
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
                overflow: hidden;
                font-family: Arial, sans-serif;
            }

            .html-background {
                position: absolute;
                inset: 0;
                display: grid;
                place-items: center;
                color: #e7f7ff;
                background:
                    linear-gradient(90deg, rgba(87, 215, 255, 0.18) 1px, transparent 1px),
                    linear-gradient(rgba(87, 215, 255, 0.18) 1px, transparent 1px),
                    radial-gradient(circle at 28% 24%, rgba(49, 168, 255, 0.24), transparent 34%),
                    linear-gradient(135deg, #07111f 0%, #101827 45%, #05070c 100%);
                background-size:
                    64px 64px,
                    64px 64px,
                    auto,
                    auto;
            }

            .html-background::before {
                content: "HTML background behind transparent globe canvas";
                max-width: min(960px, calc(100% - 48px));
                padding: 30px 38px;
                border: 1px solid rgba(130, 225, 255, 0.42);
                background: rgba(2, 8, 18, 0.66);
                font-size: 48px;
                font-weight: 700;
                line-height: 1.25;
                text-align: center;
                box-shadow: 0 0 48px rgba(87, 215, 255, 0.18);
            }

            #earth {
                position: absolute;
                inset: 0;
                background: transparent;
            }

            #earth .og-inner {
                background: transparent;
            }
        </style>
    </head>

    <body>
        <div class="html-background"></div>
        <div id="earth"></div>

        <script type="module" id="og-sandbox-script">
            import { Globe, OpenStreetMap } from "../../lib/og.es.js";

            window.globe = new Globe({
                target: "earth",
                name: "Earth",
                transparentBackground: true,
                controls: [],
                layers: [new OpenStreetMap()]
            });
        </script>
    </body>
</html>
