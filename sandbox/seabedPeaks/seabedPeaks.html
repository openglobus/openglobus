<html>
<head>
    <title>OpenGlobus - Seabed Peaks</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../css/og.css" type="text/css" />
    <style>
        body {
            padding: 0;
            margin: 0;
        }
    </style>
</head>

<body>
<div id="globus" style="position: absolute; width: 100%; height: 100%"></div>
<script type="module" id="og-sandbox-script">
    import { Globe, control, RgbTerrain } from "../../lib/og.es.js";

    const LON = 37.8,
        LAT = 44.7,
        ZOOM = 17,
        SIZE = 256;

    const n = 2 ** ZOOM,
        lat = (LAT * Math.PI) / 180,
        tileX = Math.floor(((LON + 180) / 360) * n),
        tileY = Math.floor(((1 - Math.log(Math.tan(lat) + 1 / Math.cos(lat)) / Math.PI) / 2) * n);

    const tileLon = (x) => (x / n) * 360 - 180,
        tileLat = (y) => (Math.atan(Math.sinh(Math.PI * (1 - (2 * y) / n))) * 180) / Math.PI;

    const tileExtent = [tileLon(tileX), tileLat(tileY + 1), tileLon(tileX + 1), tileLat(tileY)];

    // Terrain extent is a bit inside the tile, so the neighbour tiles are not requested
    const EPS = 1e-9;

    // Segment grids up to the vertex grid, so the elevation grid is seen as it is
    const DEFAULT_GRID_SIZES = [
        64, 32, 16, 8, 8, 8, 16, 16, 16, 32, 32, 32, 32, 32, 32, 64, 64, 64, 32, 32, 16, 8
    ];

    // A vertex per pixel: the tile is the last terrain zoom, its pixels are the grid itself
    const terrain = new RgbTerrain("Seabed", {
        url: `./${SIZE}/{z}/{x}/{y}.png`,
        encoding: "terrarium",
        imageSize: SIZE,
        plainGridSize: SIZE,
        //gridSizeByZoom: DEFAULT_GRID_SIZES.map((gs, z) => (z < ZOOM ? gs : SIZE)),
        minZoom: ZOOM,
        maxZoom: ZOOM,
        maxNativeZoom: ZOOM,
        extent: [
            [tileExtent[0] + EPS, tileExtent[1] + EPS],
            [tileExtent[2] - EPS, tileExtent[3] - EPS]
        ]
    });

    window.globe = new Globe({
        target: "globus",
        name: "Earth",
        terrain: terrain,
        maxGridSize: 256,
        viewExtent: tileExtent
    });

    globe.planet.addControl(new control.LayerSwitcher());
    globe.planet.addControl(new control.DebugInfo());
    globe.planet.addControl(new control.TimelineControl());
    globe.planet.addControl(new control.ToggleWireframe());
</script>
</body>
</html>
