<!DOCTYPE html>
<html>
<head>
    <title>OpenGlobus - GeoTIFF / COG Metadata Reader</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../css/og.css" type="text/css" />
    <style>
        body {
            padding: 0;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #globus {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .control-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 12px 14px;
            border-radius: 4px;
            font-size: 13px;
            z-index: 1000;
            width: 320px;
            box-sizing: border-box;
            max-height: calc(100vh - 20px);
            overflow-y: auto;
        }

        .control-panel h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
        }

        .control-row {
            margin-bottom: 8px;
        }

        .control-row label {
            display: block;
            margin-bottom: 2px;
            font-size: 12px;
            color: #ccc;
        }

        .control-panel select,
        .control-panel input[type="text"],
        .control-panel button {
            width: 100%;
            box-sizing: border-box;
            padding: 5px;
            font-size: 12px;
            background: #222;
            color: #eee;
            border: 1px solid #555;
            border-radius: 3px;
        }

        .control-panel button {
            cursor: pointer;
            margin-top: 5px;
            background: #333;
        }

        .control-panel button:hover {
            background: #444;
        }

        .meta-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px;
            margin-top: 8px;
            max-height: 420px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 11px;
            word-break: break-all;
            line-height: 1.4;
        }
    </style>
    <script src="./metadata.js" type="module"></script>
</head>
<body>
    <div id="globus"></div>

    <div class="control-panel">
        <h4>GeoTIFF Metadata Reader</h4>

        <div class="control-row">
            <label>Select Sample COG:</label>
            <select id="datasetSelect">
                <option value="sentinel2" selected>Sentinel-2 L2A TCI (RGB)</option>
                <option value="solar">Solar Power Potential (Single-Band)</option>
            </select>
        </div>
        <div class="control-row">
            <label>Metadata:</label>
            <div id="metaBox" class="meta-box">Loading metadata...</div>
        </div>
    </div>
</body>
</html>
