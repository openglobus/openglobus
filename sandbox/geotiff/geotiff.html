<!DOCTYPE html>
<html>
<head>
    <title>OpenGlobus - GeoTIFF / COG Layer</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../css/og.css" type="text/css" />
    <style>
        body {
            padding: 0;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #globus {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .control-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 13px;
            z-index: 1000;
            width: 250px;
            box-sizing: border-box;
        }

        .control-panel h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
        }

        .control-row {
            margin-bottom: 8px;
        }

        .control-row label {
            display: block;
            margin-bottom: 2px;
            font-size: 12px;
            color: #ccc;
        }

        .control-panel select,
        .control-panel button,
        .control-panel input[type="range"] {
            width: 100%;
            box-sizing: border-box;
        }

        .control-panel button {
            cursor: pointer;
            margin-top: 4px;
            padding: 4px;
        }

        .flex-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .flex-col {
            flex: 1;
        }

        .meta-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px;
            margin-top: 4px;
            max-height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 11px;
            word-break: break-all;
        }
    </style>
    <script src="./geotiff.js" type="module"></script>
</head>
<body>
    <div id="globus"></div>

    <div class="control-panel">
        <h4>GeoTIFF / COG</h4>

        <div class="control-row">
            <label>Color Palette:</label>
            <select id="colorScaleSelect">
                <option value="viridis" selected>Viridis</option>
                <option value="turbo">Turbo</option>
                <option value="rainbow">Rainbow</option>
                <option value="earth">Earth</option>
                <option value="greys">Greys</option>
                <option value="coolwarm">Coolwarm</option>
                <option value="inferno">Inferno</option>
                <option value="jet">Jet</option>
                <option value="hot">Hot</option>
                <option value="cool">Cool</option>
            </select>
        </div>

        <div class="control-row">
            <div class="flex-row" style="justify-content: space-between;">
                <label style="margin: 0;">Opacity:</label>
                <span id="opacityVal">100%</span>
            </div>
            <input type="range" id="opacitySlider" min="0" max="1" step="0.02" value="1">
        </div>

    </div>
</body>
</html>
