<html>
    <head>
        <title>OpenGlobus - Neighbors</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../../lib/og.css" type="text/css" />
        <style>
            body {
                padding: 0;
                margin: 0;
            }
        </style>
    </head>

    <body>
        <div id="globus" style="position: absolute; width: 100%; height: 100%"></div>
        <script type="module" id="og-sandbox-script">
            import {
                CanvasTiles,
                EmptyTerrain,
                Globe,
                GlobusRgbTerrain,
                MapterhornTerrain,
                OpenStreetMap,
                control
            } from "../../lib/og.es.js";

            const blackTile = document.createElement("canvas");
            blackTile.width = blackTile.height = 256;
            const ctx = blackTile.getContext("2d");
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, 256, 256);

            const black = new CanvasTiles("Black", {
                isBaseLayer: true,
                drawTile: (material, applyCanvas) => applyCanvas(blackTile)
            });

            const osm = new OpenStreetMap("OpenStreetMap", {
                isBaseLayer: true,
                visibility: false
            });

            window.globus = new Globe({
                target: "globus",
                name: "Neighbors",
                terrain: [new EmptyTerrain({ name: "Empty" }), new GlobusRgbTerrain(), new MapterhornTerrain()],
                layers: [black, osm],
                atmosphereEnabled: false,
                idleMode: true,
                nightTextureSrc: null,
                specularTextureSrc: null
            });

            // A crack between the black tiles shows the background, on a black one it could not be seen
            globus.renderer.clearColor.set([1, 1, 1, 1]);

            globus.planet.addControl(new control.LayerSwitcher());
            globus.planet.addControl(new control.ToggleWireframe());
            globus.planet.addControl(new control.DebugInfo());
        </script>
    </body>
</html>
