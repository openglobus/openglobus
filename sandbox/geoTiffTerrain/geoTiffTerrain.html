<html>
<head>
    <title>OpenGlobus - GeoTIFF Terrain</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../css/og.css" type="text/css" />
    <style>
        body {
            padding: 0;
            margin: 0;
        }
    </style>
</head>

<body>
<div id="globus" style="position: absolute; width: 100%; height: 100%"></div>
<script type="module" id="og-sandbox-script">
    import { Globe, control, GeoTiffTerrain, GeoTIFFLayer, OpenStreetMap } from "../../lib/og.es.js";

    const dem2m = new GeoTiffTerrain("dem2m", {
        src: "./dem2m-lerc02-cog.tiff"
    });

    const usgs = new GeoTiffTerrain("USGS Zion", {
        src: "./zion-cog.tif"
    });

    const createRaster = (name, src) =>
        new GeoTIFFLayer(name, {
            src: src,
            isBaseLayer: false,
            visibility: true,
            opacity: 0.7,
            renderOptions: { single: { band: 1, colorScale: "earth" } }
        });

    window.globe = new Globe({
        target: "globus",
        name: "Earth",
        terrain: [dem2m, usgs],
        layers: [
            new OpenStreetMap(),
            createRaster("dem2m raster", "./dem2m-lerc02-cog.tiff"),
            createRaster("USGS Zion raster", "./zion-cog.tif")
        ]
    });

    function flyToTerrain(terrain) {
        terrain.whenReady().then(() => {
            console.log(`${terrain.name} native zoom ${terrain.maxNativeZoom}`);
            globe.planet.flyExtent(terrain.reader.extentWgs84, undefined, { duration: 5000 });
        });
    }

    globe.planet.events.on("terrainchange", flyToTerrain);
    flyToTerrain(globe.planet.terrain);

    globe.planet.addControl(new control.LayerSwitcher());
    globe.planet.addControl(new control.DebugInfo());
    globe.planet.addControl(new control.ToggleWireframe());
</script>
</body>
</html>
