<!DOCTYPE html>
<html>
<head>
    <title>OpenGlobus - GeoZarr Mediterranean Cube</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../css/og.css" type="text/css" />
    <style>
        html, body, #globus { margin: 0; width: 100%; height: 100%; overflow: hidden; font: 13px Arial, sans-serif; }
        .panel { position: absolute; top: 10px; left: 10px; z-index: 1000; width: 290px;
                 padding: 10px 14px; background: rgba(0, 0, 0, 0.7); color: #fff; border-radius: 4px; }
        .panel h4 { margin: 0 0 8px; }
        .panel label { display: flex; justify-content: space-between; margin-top: 8px; }
        .panel select, .panel input { width: 100%; box-sizing: border-box; }
        .row { display: flex; gap: 8px; align-items: center; }
        .row input { flex: 1; }
        .legend { height: 10px; margin-top: 4px; border-radius: 2px; }
        .status { margin-top: 8px; font-size: 11px; color: #ccc; }
    </style>
    <script src="./medcube.js" type="module"></script>
</head>
<body>
    <div id="globus"></div>

    <div class="panel">
        <h4>Mediterranean biophysics cube (GeoZarr)</h4>

        <label>Variable</label>
        <select id="variableSelect"></select>

        <label>Date <span id="timeVal"></span></label>
        <div class="row">
            <button id="playButton" title="Play">▶</button>
            <input type="range" id="timeSlider" min="0" max="0" step="1" value="0">
        </div>

        <div id="depthRow">
            <label>Depth <span id="depthVal"></span></label>
            <input type="range" id="depthSlider" min="0" max="0" step="1" value="0">
        </div>

        <label>Range <span id="rangeVal"></span></label>
        <input type="range" id="minSlider">
        <input type="range" id="maxSlider">
        <div class="legend" id="legend"></div>

        <label>Opacity <span id="opacityVal">90%</span></label>
        <input type="range" id="opacitySlider" min="0" max="1" step="0.02" value="0.9">

        <div class="status" id="status"></div>
    </div>
</body>
</html>
