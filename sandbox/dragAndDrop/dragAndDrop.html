<html>

<head>
    <title>Drag and Drop Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../lib/og.css" type="text/css" />
</head>

<body>
<div id="earth" style="width:100%;height:100%"></div>
<script type="module" id="og-sandbox-script">
    import {
        Globe,
        GlobusRgbTerrain,
        OpenStreetMap,
        control
    } from "../../lib/og.es.js";

    let globe = new Globe({
        name: "earth",
        target: "earth",
        terrain: new GlobusRgbTerrain(),
        layers: [new OpenStreetMap()]
    });

    globe.planet.addControl(new control.LayerSwitcher());
    globe.planet.addControl(new control.DragAndDrop());

    let entityEditor = new control.EntityEditor();
    let entityTree = new control.EntityTree({ entityEditor });

    globe.planet.addControl(entityEditor);
    globe.planet.addControl(entityTree);

    entityEditor.events.on("select", (entity) => {
        entityTree.addEntity(entity);
        entityTree.show();
    });

    window.globe = globe;
</script>
</body>

</html>
