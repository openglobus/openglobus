<html>
    <head>
        <title>OpenGlobus - Cube geoid</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../../lib/og.css" type="text/css" />
        <style>
            body {
                padding: 0;
                margin: 0;
            }
        </style>
    </head>

    <body>
        <div id="globus" style="position: absolute; width: 100%; height: 100%"></div>
        <script type="module" id="og-sandbox-script">
            import { CanvasTiles, EquiangularCubeQuadTreeStrategy, Globe, ProceduralTerrain, control } from "../../lib/og.es.js";

            const HEIGHT_FACTOR = 8000;

            const FACE_COLORS = ["#e6e6e6", "#d9534f", "#5cb85c", "#428bca", "#f0ad4e", "#6f5499"];

            const tiles = new CanvasTiles("Cube tiles", {
                isBaseLayer: false,
                drawTile: (material, applyCanvas) => {
                    const { tileGroup, tileX, tileY, tileZoom } = material.segment,
                        canvas = document.createElement("canvas");

                    canvas.width = canvas.height = 256;

                    const ctx = canvas.getContext("2d");

                    ctx.fillStyle = FACE_COLORS[tileGroup];
                    ctx.fillRect(0, 0, 256, 256);

                    ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
                    if ((tileX + tileY) % 2) {
                        ctx.fillRect(0, 0, 256, 256);
                    }

                    ctx.strokeStyle = "black";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(0, 0, 256, 256);

                    ctx.fillStyle = "black";
                    ctx.font = "bold 28px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(`face ${tileGroup}`, 128, 110);
                    ctx.fillText(`${tileZoom} / ${tileX} / ${tileY}`, 128, 150);

                    applyCanvas(canvas);
                }
            });

            const SIZE = 33;
            const ZERO_HEIGHTS = new Float32Array(SIZE * SIZE);

            const geoid = new ProceduralTerrain("Geoid", {
                geoidSrc: "https://openglobus.org/geoid/egm84-30.pgm",
                maxZoom: 9,
                maxHeight: 100,
                getHeights: () => ZERO_HEIGHTS
            });

            window.globus = new Globe({
                target: "globus",
                name: "Cube geoid",
                quadTreeStrategyPrototype: EquiangularCubeQuadTreeStrategy,
                terrain: geoid,
                layers: [tiles],
                atmosphereEnabled: false,
                idleMode: true,
                nightTextureSrc: null,
                specularTextureSrc: null
            });

            globus.planet.setHeightFactor(HEIGHT_FACTOR);

            globus.planet.addControl(new control.LayerSwitcher());
            globus.planet.addControl(new control.ToggleWireframe());
            globus.planet.addControl(new control.DebugInfo());
        </script>
    </body>
</html>
