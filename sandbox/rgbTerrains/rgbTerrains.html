<html>
    <head>
        <title>OpenGlobus - RGB Terrains</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../../css/og.css" type="text/css" />
        <style>
            body {
                padding: 0;
                margin: 0;
            }
        </style>
    </head>

    <body>
        <div id="globus" style="position: absolute; width: 100%; height: 100%"></div>
        <script type="module" id="og-sandbox-script">
            import { Globe, OpenStreetMap, control, GlobusRgbTerrain, MapterhornTerrain } from "../../lib/og.es.js";

            const osm = new OpenStreetMap("OpenStreetMap", {
                isBaseLayer: true
            });

            const terrains = [
                new GlobusRgbTerrain("OpenGlobus 128"),
                new GlobusRgbTerrain("OpenGlobus 256", {
                    plainGridSize: 256
                }),
                new MapterhornTerrain("Mapterhorn 128", {
                    plainGridSize: 128
                }),
                new MapterhornTerrain("Mapterhorn 256")
            ];

            window.globe = new Globe({
                target: "globus",
                name: "Earth",
                terrain: terrains,
                layers: [osm],
                atmosphereEnabled: true
            });

            globe.planet.addControl(new control.LayerSwitcher());
        </script>
    </body>
</html>
