<html>
    <head>
        <title>OpenGlobus - Cube GeoTIFF</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../../lib/og.css" type="text/css" />
        <style>
            body {
                padding: 0;
                margin: 0;
            }
        </style>
    </head>

    <body>
        <div id="globus" style="position: absolute; width: 100%; height: 100%"></div>
        <script type="module" id="og-sandbox-script">
            import {
                CanvasTiles,
                EquiangularCubeQuadTreeStrategy,
                GeoTIFFLayer,
                GeoTiffTerrain,
                Globe,
                control
            } from "../../lib/og.es.js";

            // The GeoTIFF files of sandbox/geoTiffTerrain
            const DEM2M = "../geoTiffTerrain/dem2m-lerc02-cog.tiff";
            const ZION = "../geoTiffTerrain/zion-cog.tif";

            const FACE_COLORS = ["#e6e6e6", "#d9534f", "#5cb85c", "#428bca", "#f0ad4e", "#6f5499"];

            const tiles = new CanvasTiles("Cube tiles", {
                isBaseLayer: true,
                drawTile: (material, applyCanvas) => {
                    const { tileGroup, tileX, tileY, tileZoom } = material.segment,
                        canvas = document.createElement("canvas");

                    canvas.width = canvas.height = 256;

                    const ctx = canvas.getContext("2d");

                    ctx.fillStyle = FACE_COLORS[tileGroup];
                    ctx.fillRect(0, 0, 256, 256);

                    ctx.strokeStyle = "black";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(0, 0, 256, 256);

                    ctx.fillStyle = "black";
                    ctx.font = "bold 28px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(`face ${tileGroup}`, 128, 110);
                    ctx.fillText(`${tileZoom} / ${tileX} / ${tileY}`, 128, 150);

                    applyCanvas(canvas);
                }
            });

            const heightsOptions = { renderOptions: { resampleMethod: "bilinear" } };

            const dem2m = new GeoTiffTerrain("dem2m", { src: DEM2M, maxNativeZoom: 14, ...heightsOptions });
            const zion = new GeoTiffTerrain("USGS Zion", { src: ZION, maxNativeZoom: 15, ...heightsOptions });

            const createRaster = (name, src) =>
                new GeoTIFFLayer(name, {
                    src,
                    isBaseLayer: false,
                    opacity: 0.7,
                    renderOptions: { single: { band: 1, colorScale: "earth" } }
                });

            window.globus = new Globe({
                target: "globus",
                name: "Cube GeoTIFF",
                quadTreeStrategyPrototype: EquiangularCubeQuadTreeStrategy,
                terrain: [dem2m, zion],
                layers: [tiles, createRaster("dem2m raster", DEM2M), createRaster("USGS Zion raster", ZION)],
                atmosphereEnabled: false,
                nightTextureSrc: null,
                specularTextureSrc: null
            });

            function flyToTerrain(terrain) {
                terrain.whenReady().then(() => {
                    globus.planet.flyExtent(terrain.reader.extentWgs84, undefined, { duration: 5000 });
                });
            }

            globus.planet.events.on("terrainchange", flyToTerrain);
            flyToTerrain(globus.planet.terrain);

            globus.planet.addControl(new control.LayerSwitcher());
            globus.planet.addControl(new control.ToggleWireframe());
            globus.planet.addControl(new control.DebugInfo());
        </script>
    </body>
</html>
